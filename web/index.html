<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- No black-translucent: iOS 26 blurs the top of pages drawn under the status bar. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Inventory">
  <meta name="theme-color" content="#232136" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#faf4ed" media="(prefers-color-scheme: light)">
  <title>Inventory</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand" id="brand"><span class="brand-name">Inventory</span></span>
    <label class="searchbar">
      <span class="search-icon" id="search-icon"></span>
      <input type="search" id="search" class="search-input" placeholder="Find a part, a slot (A-12), #tag, @box…"
             autocomplete="off" spellcheck="false" autocapitalize="off" enterkeyhint="search" aria-label="Search">
      <span class="result-count" id="result-count"></span>
    </label>
    <button type="button" class="button primary add-button" id="add-button" title="Add parts (a)"><span class="label">Add</span></button>
    <button type="button" class="icon-button" id="more-button" title="More"></button>
  </header>

  <div class="panes">
    <main class="results" id="results" aria-label="Results"></main>
    <aside class="preview" id="preview" aria-label="Details"></aside>
  </div>

  <button type="button" class="fab" id="fab" title="Add parts" aria-label="Add parts"></button>

  <footer class="statusbar">
    <div class="status-left">
      <span class="status-mode normal" id="status-mode">-- NORMAL --</span>
      <span class="status-position" id="status-position">0 / 0</span>
      <span class="status-selection" id="status-selection"></span>
    </div>
    <div class="status-hints">
      <span><kbd>/</kbd> search</span>
      <span><kbd>j</kbd><kbd>k</kbd> move</span>
      <span><kbd>a</kbd> add</span>
      <span><kbd>m</kbd> move to</span>
      <span><kbd>s</kbd> swap</span>
      <span><kbd>b</kbd> boxes</span>
      <button type="button" class="status-help" id="status-help"><kbd>?</kbd> help</button>
    </div>
  </footer>
</body>
</html>
