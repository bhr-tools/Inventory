<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- No black-translucent: iOS 26 blurs the top of pages drawn under the status bar. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Inventory">
  <meta name="theme-color" content="#232136" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#faf4ed" media="(prefers-color-scheme: light)">
  <title>Inventory</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <!-- Sticky and opaque at the top edge: iOS 26 extends its colour under the
       status bar instead of blurring the top of the page. -->
  <header class="masthead">
    <div class="meta">
      <span id="meta-title">Inventory · Parts</span>
      <span class="meta-info" id="meta-info"></span>
    </div>
    <div class="mast-row">
      <h1 class="view-title" id="view-title">Parts</h1>
      <!-- Desktop: the tabs are the page title. Phones: a bar at the bottom. -->
      <nav class="tabs" aria-label="Lists">
        <button type="button" class="tab active" id="tab-parts"><span class="tab-key">1</span><span class="tab-label">Parts</span></button>
        <button type="button" class="tab" id="tab-tools"><span class="tab-key">2</span><span class="tab-label">Tools</span></button>
        <button type="button" class="tab" id="tab-shopping"><span class="tab-key">3</span><span class="tab-label">To buy</span> <span class="tab-count" id="shopping-count"></span></button>
        <button type="button" class="tab tab-add" id="tab-add"><span class="tab-label">+ Add</span></button>
      </nav>
      <label class="find">
        <span class="find-label">find:</span>
        <input type="search" id="search" class="search-input" placeholder="name, A-12, #tag, @box"
               autocomplete="off" spellcheck="false" autocapitalize="off" enterkeyhint="search" aria-label="Search">
        <span class="result-count" id="result-count"></span>
        <button type="button" class="find-clear" id="search-clear" hidden>clear</button>
      </label>
      <button type="button" class="button primary add-button" id="add-button" title="Add (a)">+ Add <kbd>a</kbd></button>
      <button type="button" class="icon-button more-button" id="more-button" title="More" aria-label="More"></button>
    </div>
  </header>

  <div class="panes">
    <main class="results-pane">
      <div class="results" id="results" aria-label="Results"></div>
    </main>
    <aside class="preview" id="preview" aria-label="Details"></aside>
  </div>

  <footer class="statusbar">
    <div class="status-left">
      <span class="status-mode normal" id="status-mode">-- NORMAL --</span>
      <span class="status-position" id="status-position">0 / 0</span>
      <span class="status-selection" id="status-selection"></span>
    </div>
    <div class="status-hints">
      <span><kbd>/</kbd> find</span>
      <span><kbd>j</kbd><kbd>k</kbd> move</span>
      <span><kbd>a</kbd> add</span>
      <span><kbd>+</kbd><kbd>-</kbd> quantity</span>
      <span><kbd>f</kbd> attach</span>
      <span><kbd>m</kbd> move to</span>
      <span><kbd>b</kbd> boxes</span>
      <button type="button" class="status-help" id="status-help"><kbd>?</kbd> help</button>
    </div>
  </footer>
</body>
</html>
